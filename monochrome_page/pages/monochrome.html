<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellectro</title>
    
    <link rel="stylesheet" href="../styles/monochrome_styles.css">
    
    <link rel="icon" href="../assets/icons/logo.png" type="image/x-icon">

</head>
<body>

    <header class="main-header">
        <div class="logo">
            <a href="#" class="logo-btn"><img src="../../assets/icons/logo.png" alt="Logo" class="logo"></a>
        </div>

        <div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">ΣΤΑΘΕΡΟ</a></li>
                    <li><a href="#">ΚΙΝΗΤΟ</a></li>
                    <li><a href="#">INTERNET</a></li>
                    <li><a href="#">ΠΡΟΙΟΝΤΑ</a></li>
                    <li><a href="#">ΥΠΗΡΕΣΙΕΣ</a></li>
                </ul>
            </nav>
        </div>

        <div class="auth-buttons" style="padding: 0;">
        <a href="#" class="signup-link">
            <img src="../../assets/icons/profile.png" alt="Profile Icon" class="icon">
            <span>Sign up</span>
        </a>
        </div>

    </header>


    <main>
        <section class="carousel">

        <div class="carousel-container">
            <div class="carousel-slide" id="carousel-slide">
                <div class="carousel-item" style="background-image: url('../../assets/images/abstract-unsplash.jpg');" data-link="https://example.com/1"></div>
                <div class="carousel-item" style="background-image: url('../../assets/images/abstract-blue-unsplash.jpg');" data-link="https://example.com/2"></div>
                <!--<div class="carousel-item" style="background-image: url('../assets/images/image3.jpg');" data-link="https://example.com/3"></div>
            -->
            </div>

            <button class="learn-more-btn" id="learnMoreBtn">LEARN MORE</button>

            <div class="carousel-dots" id="carousel-dots">
                <!-- Dots generated by JS -->
            </div>
            </div>


            <button class="carousel-button left">&#10094;</button>
            <button class="carousel-button right">&#10095;</button>
        </section>

        <br>
        <hr>
        <br>
        <br>

    </main>

    <!-- JavaScript: go up one level to js scripts/ -->
    <script src="../scripts/monochrome_script.js"></script>
</body>
</html>
