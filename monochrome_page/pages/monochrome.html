<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellectro</title>
    
    <link rel="stylesheet" href="../styles/monochrome_styles.css">
    
    <link rel="icon" href="../assets/icons/logo.png" type="image/x-icon">

</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <a href="#" class="logo">
                <img src="../../assets/icons/logo.png" alt="Cellectro Home" class="logo">
            </a>
        </div>



        <nav class="main-nav" aria-label="Primary Navigation">
            <ul>
                <li><a href="#">ΣΤΑΘΕΡΟ</a></li>
                <li><a href="#">ΚΙΝΗΤΟ</a></li>
                <li><a href="#">INTERNET</a></li>
                <li><a href="#">ΠΡΟΙΟΝΤΑ</a></li>
                <li><a href="#">ΥΠΗΡΕΣΙΕΣ</a></li>
            </ul>
        </nav>

        <div class="auth-buttons" style="padding: 0;">
        <a href="#" class="signup-link">
            <img src="../../assets/icons/profile.png" alt="Profile Icon" class="icon">
            <span>Sign up</span>
        </a>
        </div>

    </header>

    <main>
    <section class="carousel-container">
        <div class="carousel">
        <div class="carousel-track">
            <img src="../../assets/images/abstract-blue-unsplash.jpg" class="carousel-image" alt="Image 1">
            <img src="../../assets/images/abstract-blue-unsplash.jpg" class="carousel-image" alt="Image 2">
            <img src="../../assets/images/abstract-blue-unsplash.jpg" class="carousel-image" alt="Image 3">
        </div>

        <button class="carousel-button left">&#10094;</button>
        <button class="carousel-button right">&#10095;</button>

        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        </div>
    </section>
    </main>

    <!-- JavaScript: go up one level to js scripts/ -->
    <script src="../scripts/monochrome_script.js"></script>

</body>
</html>
