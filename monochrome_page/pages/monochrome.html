<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellectro</title>
    <link rel="stylesheet" href="../styles/monochrome_styles.css">
    <link rel="icon" href="../assets/icons/logo.png" type="image/x-icon">

</head>
<body>

    <header class="main header" id="header">
        <nav class="primary navigation" role="navigation">
            <div class="logo-container">
                <a href="../pages/monochrome.html" class="logo">
                    <img class="logo" role="button" src="../../assets/icons/logo.png" alt="Cellectro Home">
                </a>                
            </div>


            <ul class="navigation-list">
                <li class="dropdown"><a href="#">ΣΤΑΘΕΡΟ</a></li>
                <li class="dropdown"><a href="#">ΚΙΝΗΤΟ</a></li>
                <li class="dropdown"><a href="#">INTERNET</a></li>
                <li class="dropdown"><a href="#">ΠΡΟΙΟΝΤΑ</a></li>
                <li class="dropdown"><a href="#">ΥΠΗΡΕΣΙΕΣ</a></li>
            </ul>

            <div class="authentication">
                <a href="#" class="signup">
                    <img  class="icon" src="../../assets/icons/profile.png" alt="Profile Icon">
                    <span class="label" >Sign up</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="slideshow-container">
            <div class="mySlides fade">
            <img src="../assets/abstract-blue-unsplash.jpg" style="width:100%" alt="image 1">
            </div>

            <div class="mySlides fade">
            <img src="../assets/abstract-unsplash.jpg" style="width:100%" alt="image 2">
            </div>

            <div class="mySlides fade">
            <img src="../assets/abstract-blue-unsplash.jpg" style="width:100%" alt="image 3">
            </div>

            <div class="mySlides fade">
            <img src="../assets/abstract-unsplash.jpg" style="width:100%" alt="image 4">
            </div>

            <a class="prev" onclick="plusSlides(-1)">❮</a>
            <a class="next" onclick="plusSlides(1)">❯</a>

            <div class="dots">
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
                <span class="dot" onclick="currentSlide(4)"></span>
            </div>

        </section>
    </main>

    <!-- JavaScript: go up one level to js scripts/ -->
    <script src="../scripts/monochrome_script.js"></script>

</body>
</html>
